<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Brand Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="70%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Frosting Cream Gradient -->
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>

    <!-- Shadow for Icon Mark -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#F43F5E" flood-opacity="0.3" />
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left) -->
  <g transform="translate(10, 10)">
    <!-- Squircle base with shadow -->
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#bgGrad)" filter="url(#softShadow)" />

    <!-- Glossy upper highlight -->
    <path d="M 0 28 C 0 12.5 12.5 0 28 0 L 72 0 C 87.5 0 100 12.5 100 28 C 100 35 60 48 0 45 Z" fill="#FFFFFF" opacity="0.22" />

    <!-- Cupcake wrapper (Base) -->
    <path d="M 28 62 L 72 62 L 66 84 C 65.5 86 63.5 88 61 88 L 39 88 C 36.5 88 34.5 86 34 84 Z" fill="#FFF9F5" />
    <!-- Wrapper pleats -->
    <line x1="39" y1="64" x2="41" y2="86" stroke="#FBD5C5" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="64" x2="50" y2="86" stroke="#FBD5C5" stroke-width="2.2" stroke-linecap="round" />
    <line x1="61" y1="64" x2="59" y2="86" stroke="#FBD5C5" stroke-width="2" stroke-linecap="round" />

    <!-- Frosting Cloud Layers (Tier 1 - Bottom) -->
    <rect x="20" y="50" width="60" height="16" rx="8" fill="url(#frostGrad)" />
    <!-- Frosting Cloud Layers (Tier 2 - Middle) -->
    <rect x="27" y="38" width="46" height="15" rx="7.5" fill="url(#frostGrad)" />
    <!-- Frosting Cloud Layers (Tier 3 - Top Swirl) -->
    <rect x="36" y="27" width="28" height="14" rx="7" fill="url(#frostGrad)" />

    <!-- Ruby Cherry On Top -->
    <circle cx="50" cy="22" r="7.5" fill="#E11D48" />
    <circle cx="48" cy="19.5" r="2.2" fill="#FFFFFF" opacity="0.85" />
    <!-- Cherry Stem -->
    <path d="M 51 15 C 53 10 59 10 61 12" stroke="#22C55E" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Play Button inside wrapper -->
    <polygon points="46,70 58,75.5 46,81" fill="#E11D48" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Right) -->
  <g transform="translate(130, 20)">
    <!-- "Sweet" text with lush gradient -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="url(#textGrad)">Sweet</text>
    
    <!-- "Reels" text with dark stone slate contrast -->
    <text x="135" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#1C1917">Reels</text>

    <!-- Subtitle badge / Tagline -->
    <rect x="2" y="64" width="176" height="20" rx="10" fill="#FFF1F2" stroke="#FFE4E6" stroke-width="1" />
    <text x="14" y="78" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5" fill="#E11D48">RECEITAS &amp; PREÇOS REAIS</text>
  </g>
</svg>
