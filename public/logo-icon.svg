<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="iconFrostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F43F5E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle base -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#iconBgGrad)" filter="url(#iconShadow)" />

  <!-- Glossy upper highlight -->
  <path d="M 2 28 C 2 13 14 2 28 2 L 72 2 C 86 2 98 13 98 28 C 98 34 60 46 2 43 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- Cupcake wrapper (Base) -->
  <path d="M 28 62 L 72 62 L 66 84 C 65.5 86 63.5 88 61 88 L 39 88 C 36.5 88 34.5 86 34 84 Z" fill="#FFF9F5" />
  <!-- Wrapper pleats -->
  <line x1="39" y1="64" x2="41" y2="86" stroke="#FBD5C5" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="64" x2="50" y2="86" stroke="#FBD5C5" stroke-width="2.2" stroke-linecap="round" />
  <line x1="61" y1="64" x2="59" y2="86" stroke="#FBD5C5" stroke-width="2" stroke-linecap="round" />

  <!-- Frosting Cloud Layers -->
  <rect x="20" y="50" width="60" height="16" rx="8" fill="url(#iconFrostGrad)" />
  <rect x="27" y="38" width="46" height="15" rx="7.5" fill="url(#iconFrostGrad)" />
  <rect x="36" y="27" width="28" height="14" rx="7" fill="url(#iconFrostGrad)" />

  <!-- Ruby Cherry On Top -->
  <circle cx="50" cy="22" r="7.5" fill="#E11D48" />
  <circle cx="48" cy="19.5" r="2.2" fill="#FFFFFF" opacity="0.85" />
  <!-- Cherry Stem -->
  <path d="M 51 15 C 53 10 59 10 61 12" stroke="#22C55E" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Play Button inside wrapper -->
  <polygon points="46,70 58,75.5 46,81" fill="#E11D48" />
</svg>
